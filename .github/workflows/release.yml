name: release

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing (OIDC): npm >= 11.5.1 exchanges the GitHub id-token
      # for a short-lived publish credential, so no NPM_TOKEN secret is needed.
      - run: npm install -g npm@latest
      - run: npm publish --access public
